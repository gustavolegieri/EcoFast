spring.application.name=ecofast
server.port=8080

# Banco H2 em memória (modo MySQL): roda sem instalar nada.
# Os dados de exemplo são recriados toda vez que o servidor sobe.
spring.datasource.url=jdbc:h2:mem:ecofast;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Console do banco: http://localhost:8080/h2-console  (JDBC URL acima, usuário sa)
spring.h2.console.enabled=true

server.servlet.session.timeout=30m
