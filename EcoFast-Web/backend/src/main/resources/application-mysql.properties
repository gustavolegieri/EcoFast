# Perfil para usar o MySQL/MariaDB do XAMPP.
# 1) Importe ../banco/ecofast.sql no phpMyAdmin
# 2) Rode:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/ecofast?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.sql.init.mode=never
spring.h2.console.enabled=false
